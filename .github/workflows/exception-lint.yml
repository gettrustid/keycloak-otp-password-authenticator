# Managed by terraform (infra-terraform/github/modules/soc2-repo).
# Do not edit here - changes will be overwritten on the next apply.
#
# SOC2 fleet-standard exception-management lint.
# See modules/soc2-repo/exception-lint.tf for rationale + evidence anchors.
#
# Validates that every security exception entry in .trivyignore,
# .grype.yaml (ignore block), and .gitleaksignore carries a structured
# comment with three required fields:
#   justification=<non-empty text>
#   risk=<low|medium|high|critical>
#   fix-by=YYYY-MM-DD  (date must be today or in the future)
#
# Triggers:
#   - pull_request on dev + main with path filter — catches format violations
#     at PR time when exception files are added or modified.
#   - weekly cron — catches expired fix-by dates without a file-change event.
#   No push trigger: the PR trigger covers intent-time; cron covers decay.
#
# Normative: SOC2 AICPA TSC CC7.2 (risk acceptance monitoring), CC9.1 (risk
#            assessment with acceptance criteria), CC4.1 (monitoring activities)
#            NIST SP 800-218 v1.1 RV.1.3 (vulnerability remediation tracking)
name: exception-lint

on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - ".trivyignore"
      - ".grype.yaml"
      - ".gitleaksignore"
  schedule:
    # Weekly, staggered slot Mon 06:41 UTC — after the main Monday-morning
    # security burst (CodeQL 04:17, poutine 04:45, SBOM 05:30, Dependabot
    # 06:00) to avoid runner contention.
    - cron: "41 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  security-events: write   # SARIF upload for optional Code Scanning ingestion

concurrency:
  group: exception-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-exception-files:
    name: Lint exception file comment format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Harden-Runner intentionally omitted: this job reads 3 config files from
      # the repo and runs a pure bash parser. No external network calls, no secrets,
      # no supply-chain surface. Harden-Runner would add runtime overhead with
      # zero security benefit on this job. Fleet-wide Harden-Runner coverage is
      # provided by workflows that actually fetch or install anything.
      - name: Checkout
        # SHA pinned at v4.2.2 — matches the pin used in poutine.yml.tftpl.
        # Bump via Dependabot github-actions ecosystem.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Lint exception file comment fields
        id: lint
        shell: bash
        run: |
          set -euo pipefail

          # ----------------------------------------------------------------
          # Helpers
          # ----------------------------------------------------------------

          today=$(date -u +%Y-%m-%d)
          found_violation=0

          # emit_error <file> <line_num> <message>
          emit_error() {
            local file="$1" lineno="$2" msg="$3"
            echo "::error file=${file},line=${lineno}::${msg}"
            found_violation=1
          }

          # validate_comment_block <file> <entry_line_num> <comment_text>
          # Checks that the accumulated comment text for one exception entry
          # contains all three required fields with valid values.
          validate_comment_block() {
            local file="$1" entry_line="$2" comment="$3"

            # justification= must be present and non-empty
            if ! printf '%s' "$comment" | grep -qP 'justification=\S+'; then
              emit_error "$file" "$entry_line" \
                "Exception entry is missing 'justification=<text>' in its comment block. Add a comment line above the entry with justification=, risk=, and fix-by= fields."
            fi

            # risk= must be one of the four recognised levels
            if ! printf '%s' "$comment" | grep -qP 'risk=(low|medium|high|critical)\b'; then
              emit_error "$file" "$entry_line" \
                "Exception entry is missing a valid 'risk=<low|medium|high|critical>' field in its comment block."
            fi

            # fix-by= must be present and must be today or in the future
            local fix_by
            fix_by=$(printf '%s' "$comment" \
              | grep -oP 'fix-by=\K[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)

            if [ -z "$fix_by" ]; then
              emit_error "$file" "$entry_line" \
                "Exception entry is missing a 'fix-by=YYYY-MM-DD' field in its comment block."
            elif [[ "$fix_by" < "$today" ]]; then
              emit_error "$file" "$entry_line" \
                "Exception entry has an expired fix-by date: fix-by=${fix_by} (today is ${today}). Re-review, re-approve, and update fix-by to a future date, or remediate the finding."
            fi
          }

          # ----------------------------------------------------------------
          # Parser: .trivyignore
          # Lines starting with '#' are comments. Non-comment, non-blank
          # lines are CVE/rule entries. We collect the comment lines
          # immediately preceding each entry.
          # ----------------------------------------------------------------

          parse_trivyignore() {
            local file=".trivyignore"
            [ -f "$file" ] || return 0

            local comment_buf="" lineno=0
            while IFS= read -r line || [ -n "$line" ]; do
              lineno=$(( lineno + 1 ))
              if [[ "$line" =~ ^[[:space:]]*# ]]; then
                # Accumulate comment lines
                comment_buf="${comment_buf}${line}"$'\n'
              elif [[ "$line" =~ ^[[:space:]]*$ ]]; then
                # Blank line resets the comment buffer
                comment_buf=""
              else
                # Non-blank, non-comment: this is an exception entry
                if [ -z "$comment_buf" ]; then
                  emit_error "$file" "$lineno" \
                    "Exception entry '${line}' has no comment block above it. Add a comment with justification=, risk=, and fix-by= fields."
                else
                  validate_comment_block "$file" "$lineno" "$comment_buf"
                fi
                comment_buf=""
              fi
            done < "$file"
          }

          # ----------------------------------------------------------------
          # Parser: .grype.yaml
          # Only the `ignore:` block is in scope. Each list item starts with
          # `  - ` (one level of indentation under `ignore:`). Comment lines
          # within the block use `#` and may appear on the line before the
          # item or inline (YAML allows `# comment` after the value).
          # We enter "ignore block" mode on `^ignore:` and leave it on the
          # next top-level key or EOF.
          # ----------------------------------------------------------------

          parse_grype_yaml() {
            local file=".grype.yaml"
            [ -f "$file" ] || return 0

            local in_ignore=0 comment_buf="" lineno=0
            while IFS= read -r line || [ -n "$line" ]; do
              lineno=$(( lineno + 1 ))

              # Detect start of ignore block
              if [[ "$line" =~ ^ignore:[[:space:]]* ]]; then
                in_ignore=1
                comment_buf=""
                continue
              fi

              # Detect end of ignore block (non-indented, non-blank, non-comment key)
              if [[ $in_ignore -eq 1 ]] && [[ "$line" =~ ^[a-zA-Z] ]]; then
                in_ignore=0
                comment_buf=""
                continue
              fi

              [ $in_ignore -eq 0 ] && continue

              if [[ "$line" =~ ^[[:space:]]*# ]]; then
                comment_buf="${comment_buf}${line}"$'\n'
              elif [[ "$line" =~ ^[[:space:]]*$ ]]; then
                comment_buf=""
              elif [[ "$line" =~ ^[[:space:]]+-[[:space:]] ]]; then
                # List item — also check for inline comment on same line
                local inline_comment=""
                if [[ "$line" =~ \#(.*)$ ]]; then
                  inline_comment="${BASH_REMATCH[1]}"
                fi
                local combined="${comment_buf}${inline_comment}"
                if [ -z "$combined" ]; then
                  emit_error "$file" "$lineno" \
                    "Exception entry at line ${lineno} in the ignore block has no comment. Add a comment with justification=, risk=, and fix-by= fields above the entry or inline."
                else
                  validate_comment_block "$file" "$lineno" "$combined"
                fi
                comment_buf=""
              fi
            done < "$file"
          }

          # ----------------------------------------------------------------
          # Parser: .gitleaksignore
          # Lines starting with '#' are comments. Non-comment, non-blank
          # lines are fingerprint entries (SHA256 of the leaked secret).
          # Same accumulate-then-validate pattern as .trivyignore.
          # ----------------------------------------------------------------

          parse_gitleaksignore() {
            local file=".gitleaksignore"
            [ -f "$file" ] || return 0

            local comment_buf="" lineno=0
            while IFS= read -r line || [ -n "$line" ]; do
              lineno=$(( lineno + 1 ))
              if [[ "$line" =~ ^[[:space:]]*# ]]; then
                comment_buf="${comment_buf}${line}"$'\n'
              elif [[ "$line" =~ ^[[:space:]]*$ ]]; then
                comment_buf=""
              else
                if [ -z "$comment_buf" ]; then
                  emit_error "$file" "$lineno" \
                    "Exception entry '${line}' has no comment block above it. Add a comment with justification=, risk=, and fix-by= fields."
                else
                  validate_comment_block "$file" "$lineno" "$comment_buf"
                fi
                comment_buf=""
              fi
            done < "$file"
          }

          # ----------------------------------------------------------------
          # Run all parsers
          # ----------------------------------------------------------------

          parse_trivyignore
          parse_grype_yaml
          parse_gitleaksignore

          if [ "$found_violation" -eq 1 ]; then
            echo ""
            echo "Exception file format violations detected."
            echo "Each exception entry requires a comment block immediately above it"
            echo "containing ALL three of:"
            echo "  justification=<non-empty text describing why the exception was accepted>"
            echo "  risk=<low|medium|high|critical>"
            echo "  fix-by=YYYY-MM-DD  (must be today or a future date)"
            echo ""
            echo "Expired fix-by dates must be re-reviewed and updated or the finding remediated."
            exit 1
          fi

          echo "All exception entries have valid comment blocks."
