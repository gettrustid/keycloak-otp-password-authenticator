# Do not edit here - changes will be overwritten on the next apply.
#
# SOC2 fleet-standard Dependabot configuration.
# See modules/soc2-repo/dependabot.tf for rationale + evidence anchors.
#
# Cooldown: GitHub Changelog 2026-07-14 (7d fleet-standard default,
#           30d majors, 7d minors, 7d patches; security-exempt).
#           Bumped from 3d→7d 2026-09-26 post-INC-2026-09-17 (HellFoxx
#           Dependabot-branch hijack) to widen the yank/report window.
#           See .aiwg/security/scanning-supply-chain-defense/
#           dependabot-hardening-addendum.md §1.
# Grouping: GitHub Changelog 2024-03-28 (grouped security updates GA)
# Normative: OpenSSF Scorecard Dependency-Update-Tool (High risk)
#            NIST SP 800-218 v1.1 PW.4.4
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    reviewers:
      - "gettrustid/security"
    cooldown:
      default-days: 7
    groups:
      gha-all:
        applies-to: version-updates
        patterns: ["*"]
      gha-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
