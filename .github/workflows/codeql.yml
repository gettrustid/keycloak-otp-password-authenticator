# Managed by terraform (infra-terraform/github/modules/soc2-repo).
# Do not edit here - changes will be overwritten on the next apply.
#
# SOC2 fleet-standard CodeQL configuration.
# See modules/soc2-repo/codeql.tf for rationale + evidence anchors.
#
# Query suite: security-and-quality
#   - security-and-quality: balanced signal / false-positive rate (default)
#   - security-extended:    higher recall, more triage burden
#
# Normative: OpenSSF Scorecard SAST (Medium risk)
#            NIST SP 800-218 v1.1 PW.7 + PW.8
name: CodeQL

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    # Weekly, staggered off-hour to avoid runner contention with the
    # dependabot cadence (Mon 06:00 UTC). Matches tracer-kafka's existing
    # CodeQL schedule.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    # Skip on Dependabot-authored PRs — the diff is package.json /
    # package-lock.json (npm) or workflow `uses:` fields (github-actions),
    # neither of which changes source that CodeQL can meaningfully
    # analyze. The `push` trigger on main/dev fires
    # immediately after Dependabot merges, covering the SOC2 CC7.1
    # detection ask with zero information loss. Workflow-security supply-
    # chain risk (github-actions ecosystem) is covered separately by
    # poutine (see poutine.tf). Human PRs still run through this job.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language:
          - "java-kotlin"
          - "actions"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is the fleet default; some repos may
          # override via var.codeql_query_suite to security-extended.
          queries: security-and-quality

      # Autobuild handles the common cases:
      #   - javascript-typescript / python / ruby: no-op (source-traced)
      #   - go / java-kotlin / csharp: runs the standard build for the
      #     language so CodeQL can extract compiled artifacts.
      # Repos with unusual build systems should set enable_codeql = false
      # in tfvars and maintain a hand-authored workflow instead.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # SARIF upload to the Security tab is default-on for the action;
          # kept explicit for clarity.
          upload: true
          # Explicit output path so the gate step below can parse the SARIF.
          output: sarif-results

      # In-job SARIF parse gate — CI-time fast-feedback layer.
      #
      # This step is BELT-AND-SUSPENDERS with the primary official gate
      # implemented as github_repository_ruleset.codeql_scan_gate (see
      # modules/soc2-repo/codeql-scan-ruleset.tf). Roles:
      #
      #   Ruleset (primary, GitHub-official per Docs):
      #     Compares PR-introduced alerts to base branch; blocks merge on
      #     NEW alerts at or above security_alerts_threshold. Existing
      #     debt is grandfathered. Native GHAS UI triage lifecycle.
      #
      #   This step (fast-feedback secondary):
      #     Parses SARIF at CI time and exits 1 on ANY unsuppressed
      #     finding at or above the same threshold. Catches pre-existing
      #     debt (which the ruleset would grandfather) so the SSDLC
      #     policy's "no critical open at release" clause is enforced,
      #     not just "no new critical introduced." Also gives the
      #     developer immediate rule-id + file:line in the Actions log
      #     instead of requiring a Security tab visit.
      #
      # Threshold semantics (matches vuln_scan_severity_threshold and
      # the ruleset security_alerts_threshold):
      #   "CRITICAL"      → block on security-severity ≥ 9.0  (ruleset: "critical")
      #   "CRITICAL,HIGH" → block on security-severity ≥ 7.0  (ruleset: "high_or_higher")
      #
      # Ignores suppressed alerts (`.suppressions | length > 0`) so that
      # documented exception dismissals via the GHAS UI don't re-trigger
      # the gate on every PR. Matches the ruleset's own behavior — an
      # alert dismissed via GHAS UI is excluded from both gates.
      # Exception governance: see SSDLC policy §Exceptions (documented
      # risk + fix timeline required).
      #
      # Cite: GitHub Docs — Configuration options for code scanning
      # https://docs.github.com/en/code-security/code-scanning/managing-your-code-scanning-configuration/configuration-options-for-code-scanning
      # accessed 2026-09-26 — GRADE: HIGH (GitHub official).
      # SARIF v2.1.0 §3.27.19 (result.suppressions),
      # https://docs.oasis-open.org/sarif/sarif/v2.1.0/os/sarif-v2.1.0-os.html
      # accessed 2026-09-26 — GRADE: HIGH (OASIS standards body).
      # security-severity property: GitHub Docs — CodeQL query metadata,
      # https://codeql.github.com/docs/writing-codeql-queries/metadata-for-codeql-queries/
      # accessed 2026-09-26 — GRADE: HIGH (GitHub official).
      - name: Gate on CodeQL security findings (CRITICAL,HIGH)
        env:
          THRESHOLD: "CRITICAL,HIGH"
        run: |
          set -euo pipefail

          case "$THRESHOLD" in
            "CRITICAL")      MIN_SEV="9.0" ;;
            "CRITICAL,HIGH") MIN_SEV="7.0" ;;
            *) echo "::error::Unknown threshold '$THRESHOLD'"; exit 1 ;;
          esac

          SARIF=$(find sarif-results -maxdepth 2 -name '*.sarif' 2>/dev/null | head -1)
          if [ -z "$SARIF" ] || [ ! -f "$SARIF" ]; then
            echo "::warning::No SARIF file found at sarif-results/*.sarif; skipping gate"
            exit 0
          fi

          # Extract unsuppressed findings whose rule's security-severity
          # meets or exceeds the threshold. Rules table lives at
          # runs[].tool.driver.rules; results reference by ruleId (v1) or
          # ruleIndex (v2) — handle both.
          BLOCKING=$(jq --arg min "$MIN_SEV" '
            [ .runs[]?
              | . as $run
              | .results[]?
              | select((.suppressions // []) | length == 0)
              | (
                  (.ruleId // "") as $rid |
                  (.ruleIndex // -1) as $ridx |
                  (
                    ($run.tool.driver.rules // [])
                    | if $ridx >= 0 then .[$ridx]
                      else map(select(.id == $rid)) | .[0]
                      end
                  )
                ) as $rule
              | ($rule.properties["security-severity"] // "0") | tonumber
              | select(. >= ($min | tonumber))
            ] | length' "$SARIF")

          echo "CodeQL: $BLOCKING unsuppressed finding(s) at security-severity ≥ $MIN_SEV ($THRESHOLD)"

          if [ "$BLOCKING" -gt 0 ]; then
            echo "::error::CodeQL blocking gate failed: $BLOCKING finding(s) at or above security-severity $MIN_SEV. Resolve or document exception dismissal in the Security tab before merging."
            # Print top offenders for triage
            jq --arg min "$MIN_SEV" -r '
              .runs[]?
              | . as $run
              | .results[]?
              | select((.suppressions // []) | length == 0)
              | (
                  (.ruleId // "") as $rid |
                  (.ruleIndex // -1) as $ridx |
                  (
                    ($run.tool.driver.rules // [])
                    | if $ridx >= 0 then .[$ridx]
                      else map(select(.id == $rid)) | .[0]
                      end
                  )
                ) as $rule
              | select(($rule.properties["security-severity"] // "0" | tonumber) >= ($min | tonumber))
              | "  - \($rule.id // "?") [sev=\($rule.properties["security-severity"] // "?")]: \(.message.text // "") @ \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // "?")"
            ' "$SARIF" | head -20
            exit 1
          fi
