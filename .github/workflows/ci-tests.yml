name: CI Tests

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test, and verify coverage
        run: mvn -B verify
